<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervall Timer Beep</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    text-align:center;
}

.container{
    max-width:420px;
    margin:auto;
    padding:24px;
}

h1{
    font-size:32px;
}

input{
    width:120px;
    font-size:28px;
    text-align:center;
    padding:10px;
    border:none;
    border-radius:12px;
    margin-top:8px;
}

.row{
    margin:18px 0;
}

.timer{
    font-size:96px;
    font-weight:800;
    margin-top:30px;
}

.phase{
    font-size:30px;
    margin-top:10px;
}

.total{
    margin-top:25px;
    font-size:22px;
}

button{
    border:none;
    border-radius:14px;
    padding:18px 24px;
    margin:10px;
    font-size:22px;
    font-weight:700;
    color:white;
}

.start{ background:#17a34a; }
.pause{ background:#d18b00; }
.reset{ background:#c62828; }

.round{
    margin-top:10px;
    opacity:0.8;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>Intervall Timer</h1>

<div class="row">
<div>Übung Sekunden</div>
<input id="work" type="number" value="30">
</div>

<div class="row">
<div>Pause Sekunden</div>
<input id="rest" type="number" value="10">
</div>

<div class="row">
<div>Runden</div>
<input id="rounds" type="number" value="10">
</div>

<div class="total">
Gesamtdauer:
<span id="totalTime">06:30</span>
</div>

<div class="timer" id="timer">30</div>

<div class="phase" id="phase">Training</div>

<div class="round" id="roundInfo">Runde 1 / 10</div>

<div style="margin-top:30px;">
<button class="start" id="startBtn">Start</button>
<button class="pause" id="pauseBtn">Pause</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

</div>

<script>

let interval = null;
let running = false;

let currentPhase = "work";
let currentRound = 1;
let currentTime = 30;

const workInput = document.getElementById("work");
const restInput = document.getElementById("rest");
const roundsInput = document.getElementById("rounds");

const timerEl = document.getElementById("timer");
const phaseEl = document.getElementById("phase");
const roundEl = document.getElementById("roundInfo");
const totalEl = document.getElementById("totalTime");

function workValue(){
    return Math.max(1, parseInt(workInput.value) || 30);
}

function restValue(){
    return Math.max(0, parseInt(restInput.value) || 10);
}

function roundsValue(){
    return Math.max(1, parseInt(roundsInput.value) || 10);
}

function formatTime(sec){
    let m = Math.floor(sec / 60);
    let s = sec % 60;

    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function updateTotal(){

    let total =
        workValue() * roundsValue() +
        restValue() * (roundsValue() - 1);

    totalEl.textContent = formatTime(total);

    if(!running){
        timerEl.textContent = workValue();
    }
}

function updateDisplay(){

    timerEl.textContent = currentTime;

    phaseEl.textContent =
        currentPhase === "work"
        ? "Training"
        : "Pause";

    roundEl.textContent =
        "Runde " + currentRound +
        " / " + roundsValue();
}

function beep(){

    try{

        const ctx =
            new(window.AudioContext ||
                  window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = 900;

        osc.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.value = 0.1;

        osc.start();

        osc.stop(ctx.currentTime + 0.12);

    }catch(e){}
}

function tick(){

    currentTime--;

    if(currentTime <= 3 && currentTime > 0){
        beep();
    }

    if(currentTime <= 0){

        beep();

        if(currentPhase === "work"){

            if(restValue() > 0){

                currentPhase = "rest";
                currentTime = restValue();

            }else{

                currentRound++;

                if(currentRound > roundsValue()){
                    finish();
                    return;
                }

                currentPhase = "work";
                currentTime = workValue();
            }

        }else{

            currentRound++;

            if(currentRound > roundsValue()){
                finish();
                return;
            }

            currentPhase = "work";
            currentTime = workValue();
        }
    }

    updateDisplay();
}

function startTimer(){

    if(running) return;

    running = true;

    interval = setInterval(tick,1000);
}

function pauseTimer(){

    clearInterval(interval);
    running = false;
}

function resetTimer(){

    clearInterval(interval);

    running = false;

    currentPhase = "work";
    currentRound = 1;
    currentTime = workValue();

    updateDisplay();
}

function finish(){

    clearInterval(interval);

    running = false;

    timerEl.textContent = "0";
    phaseEl.textContent = "Fertig";
}

document.getElementById("startBtn")
.addEventListener("click",startTimer);

document.getElementById("pauseBtn")
.addEventListener("click",pauseTimer);

document.getElementById("resetBtn")
.addEventListener("click",resetTimer);

workInput.addEventListener("input",updateTotal);
restInput.addEventListener("input",updateTotal);
roundsInput.addEventListener("input",updateTotal);

updateTotal();
updateDisplay();

</script>

</body>
</html>
