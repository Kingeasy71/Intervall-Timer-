<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intervall Timer</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 400px;
    margin: auto;
}

input {
    width: 90px;
    padding: 10px;
    margin: 10px;
    font-size: 20px;
    text-align: center;
    border-radius: 8px;
    border: none;
}

.timer {
    font-size: 90px;
    font-weight: bold;
    margin: 30px 0;
}

.phase {
    font-size: 28px;
    margin-bottom: 20px;
}

button {
    padding: 15px 25px;
    margin: 10px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.start {
    background-color: #00c853;
    color: white;
}

.pause {
    background-color: #ffab00;
    color: black;
}

.reset {
    background-color: #d50000;
    color: white;
}
</style>
</head>

<body>

<div class="container">
    <h1>Intervall Timer</h1>

    <div>
        <p>Training (Sekunden)</p>
        <input type="number" id="work" value="30">
    </div>

    <div>
        <p>Pause (Sekunden)</p>
        <input type="number" id="rest" value="10">
    </div>

    <div>
        <p>Runden</p>
        <input type="number" id="rounds" value="10">
    </div>

    <h2>Gesamtdauer: <span id="total">06:30</span></h2>

    <div class="timer" id="timer">30</div>

    <div class="phase" id="phase">Training</div>

    <button class="start" id="startBtn">Start</button>
    <button class="pause" id="pauseBtn">Pause</button>
    <button class="reset" id="resetBtn">Reset</button>
</div>

<script>
let interval = null;
let currentTime = 0;
let currentRound = 1;
let isWork = true;
let running = false;

const workInput = document.getElementById("work");
const restInput = document.getElementById("rest");
const roundsInput = document.getElementById("rounds");

const timerEl = document.getElementById("timer");
const phaseEl = document.getElementById("phase");
const totalEl = document.getElementById("total");

function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    return String(min).padStart(2, '0') + ":" + String(sec).padStart(2, '0');
}

function updateTotal() {
    const work = parseInt(workInput.value) || 0;
    const rest = parseInt(restInput.value) || 0;
    const rounds = parseInt(roundsInput.value) || 0;

    const totalSeconds = (work * rounds) + (rest * Math.max(rounds - 1, 0));

    totalEl.textContent = formatTime(totalSeconds);

    if (!running) {
        timerEl.textContent = work;
    }
}

workInput.addEventListener("input", updateTotal);
restInput.addEventListener("input", updateTotal);
roundsInput.addEventListener("input", updateTotal);

updateTotal();

function beep() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        oscillator.connect(audioContext.destination);
        oscillator.frequency.value = 800;
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
    } catch(e) {}
}

function startTimer() {
    if (running) return;

    running = true;

    if (currentTime <= 0) {
        currentTime = parseInt(workInput.value);
    }

    timerEl.textContent = currentTime;

    interval = setInterval(() => {
        currentTime--;

        timerEl.textContent = currentTime;

        if (currentTime <= 0) {
            beep();

            if (navigator.vibrate) {
                navigator.vibrate(200);
            }

            if (isWork) {
                isWork = false;
                phaseEl.textContent = "Pause";
                currentTime = parseInt(restInput.value);
            } else {
                currentRound++;

                if (currentRound > parseInt(roundsInput.value)) {
                    clearInterval(interval);
                    running = false;
                    timerEl.textContent = "0";
                    phaseEl.textContent = "Fertig";
                    return;
                }

                isWork = true;
                phaseEl.textContent = "Training";
                currentTime = parseInt(workInput.value);
            }
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(interval);
    running = false;
}

function resetTimer() {
    clearInterval(interval);

    running = false;
    currentRound = 1;
    isWork = true;

    currentTime = parseInt(workInput.value);

    timerEl.textContent = currentTime;
    phaseEl.textContent = "Training";
}

document.getElementById("startBtn").addEventListener("click", startTimer);
document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
document.getElementById("resetBtn").addEventListener("click", resetTimer);
</script>

</body>
</html>
